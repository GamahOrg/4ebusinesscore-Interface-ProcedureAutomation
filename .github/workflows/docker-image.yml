name: Docker Image CI

on:
  push:
    branches: ["4E-Publish"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --build-arg NPM_TOKEN=${{ secrets.NPM_TOKEN }} \
            --tag 4epublish/4eplatform-frontapp-procedureautomation:latest

      - name: Log in to Docker Hub
        run: docker login -u 4epublish -p ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Image to Docker Hub
        run: docker push 4epublish/4eplatform-frontapp-procedureautomation:latest
